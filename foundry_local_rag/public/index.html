<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Policy RAG Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --user-bubble: rgba(99, 102, 241, 0.2);
            --bot-bubble: rgba(255, 255, 255, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }

        .app-container {
            width: 100%; max-width: 900px; height: 85vh;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .overlay {
            position: absolute; inset: 0; background: #0f172a; border-radius: 24px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; padding: 40px; text-align: center; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--glass-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        header { padding: 20px 24px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); background: rgba(255, 255, 255, 0.03); padding: 6px 12px; border-radius: 100px; border: 1px solid var(--glass-border); }
        .status-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
        .status-dot.online { background: #10b981; box-shadow: 0 0 12px #10b981; }

        .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: var(--user-bubble); border: 1px solid rgba(99, 102, 241, 0.2); border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }

        .input-panel { padding: 20px 24px; border-top: 1px solid var(--glass-border); }
        .input-wrapper { display: flex; gap: 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); padding: 6px 6px 6px 16px; border-radius: 16px; }
        input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 0.95rem; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 500; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="loader-overlay" class="overlay">
            <div class="spinner"></div>
            <h2>Initializing Local RAG Pipeline</h2>
            <p id="loader-status">Starting up SDK...</p>
        </div>

        <header>
            <h2>Onboarding FAQ Chatbot</h2>
            <div class="status-badge">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-label">Engine Offline</span>
            </div>
        </header>

        <div id="chat-area" class="chat-area"></div>

        <div class="input-panel">
            <form id="chat-form" class="input-wrapper">
                <input type="text" id="user-input" placeholder="Ask a question about employee onboarding..." autocomplete="off" disabled>
                <button type="submit" id="send-btn" disabled>Send</button>
            </form>
        </div>
    </div>

    <script>
        const loaderOverlay = document.getElementById('loader-overlay');
        const loaderStatus = document.getElementById('loader-status');
        const statusDot = document.getElementById('status-dot');
        const statusLabel = document.getElementById('status-label');
        const chatArea = document.getElementById('chat-area');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        marked.setOptions({ gfm: true, breaks: true });

        async function checkServerStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.ready) {
                    loaderOverlay.classList.add('hidden');
                    statusDot.classList.add('online');
                    statusLabel.textContent = 'RAG Ready';
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    clearInterval(statusPoller);
                } else {
                    loaderStatus.textContent = data.status;
                }
            } catch (err) {
                loaderStatus.textContent = "Connecting to Express server...";
            }
        }

        const statusPoller = setInterval(checkServerStatus, 1500);

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);

            setMessageContent(msgDiv, role, content);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msgDiv;
        }

        function setMessageContent(message, role, content) {
            // Sanitize user input and markdown response with DOMPurify
            const cleanContent = role === 'assistant' 
                ? DOMPurify.sanitize(marked.parse(content))
                : DOMPurify.sanitize(content, { ALLOWED_TAGS: [] });

            message.innerHTML = cleanContent;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;

            userInput.value = '';
            appendMessage('user', query);
            const assistantMessage = appendMessage('assistant', 'AI is thinking...');
            assistantMessage.setAttribute('role', 'status');
            assistantMessage.setAttribute('aria-live', 'polite');

            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                // Let the browser paint the pending message before starting inference.
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await res.json();
                if (res.ok) {
                    assistantMessage.removeAttribute('role');
                    assistantMessage.removeAttribute('aria-live');
                    setMessageContent(assistantMessage, 'assistant', data.answer);
                } else {
                    setMessageContent(assistantMessage, 'assistant', `Error: ${data.error}`);
                }
            } catch (err) {
                setMessageContent(assistantMessage, 'assistant', 'Error communicating with backend service.');
            } finally {
                assistantMessage.removeAttribute('role');
                assistantMessage.removeAttribute('aria-live');
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
